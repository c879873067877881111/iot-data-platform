# Mosquitto broker config — auth-hardened
# 一個帳號一個角色（simulator publish / ingestor subscribe / healthcheck），
# 用 passwd file（bcrypt）做認證、ACL 做 topic 隔離。Production 還會在 ingress
# 層加 TLS terminate，broker 自身不對外開明文 1883。

# 顯式寫 bind address：default 是 0.0.0.0，但寫清楚避免 image 預設行為變動踩雷
listener 1883 0.0.0.0

# 強制認證：mosquitto 2.0 預設就拒絕 anonymous，這裡顯式寫死避免被 image 升級翻盤
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence：broker 重啟後 queued message / retained message 還在
persistence true
persistence_location /mosquitto/data/
# 預設 1800s 才落盤 → 異常關閉會丟最近半小時資料。60s 對 demo 夠用
autosave_interval 60

# log_type 留 default（error / warning / notice / information），不需要重複寫
log_dest stdout

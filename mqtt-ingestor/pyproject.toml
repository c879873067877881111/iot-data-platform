[project]
name = "mqtt-ingestor"
version = "0.1.0"
description = "MQTT subscriber that batch-writes IoT telemetry into PostgreSQL staging"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9,<3",
    "paho-mqtt>=2.1,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

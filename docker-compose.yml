x-airflow-common:
  &airflow-common
  build: ./airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW_INTERNAL_API_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW_CONN_IOT_PLATFORM_DB: postgresql://${IOT_DB_USER}:${IOT_DB_PASSWORD}@postgres:5432/${IOT_DB_NAME}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    PYTHONPATH: '/opt/airflow/dags'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # superuser（給 entrypoint + bootstrap script 用）
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 下面這幾組是 01-create-users.sh 要用的；不傳就跑不起來。
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      IOT_DB_USER: ${IOT_DB_USER}
      IOT_DB_PASSWORD: ${IOT_DB_PASSWORD}
      IOT_DB_NAME: ${IOT_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # bootstrap：entrypoint 第一次起容器時 alphabetical 跑 initdb.d 內的 *.sh / *.sql
      - ./db/01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh
      # schema 本體放 initdb.d 外面，避免被當作 superuser-on-postgres 跑；
      # 由 01-create-users.sh 切成 iot_user 後 psql -f 進來。
      - ./db/init.sql:/opt/db-schema/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  mosquitto:
    # 自 build：用 Dockerfile COPY --chmod=0700 把 passwd/acl 權限烙進 image，
    # 避免 git 不保留 0700 → mount 進來變 644 → broker 印 world-readable warning。
    # 改 passwd / acl / mosquitto.conf 後要 `docker compose up -d --build mosquitto`。
    build: ./mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    environment:
      # healthcheck 用，傳進容器讓 CMD 能讀
      MQTT_HEALTHCHECK_USER: ${MQTT_HEALTHCHECK_USER}
      MQTT_HEALTHCHECK_PASSWORD: ${MQTT_HEALTHCHECK_PASSWORD}
    healthcheck:
      # -E 連上即斷，純測 broker 是否能 accept 連線。
      # 啟用 auth 後 healthcheck 必須帶帳密，否則 broker 直接拒連 → 永遠 unhealthy
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t healthcheck -E -W 3 -i healthcheck-probe -u $$MQTT_HEALTHCHECK_USER -P $$MQTT_HEALTHCHECK_PASSWORD || exit 1"]
      interval: 10s
      retries: 5
    restart: on-failure

  simulator:
    build: ./simulator
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${IOT_DB_NAME}
      DB_USER: ${IOT_DB_USER}
      DB_PASSWORD: ${IOT_DB_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_SIMULATOR_USER}
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
    restart: on-failure

  mqtt-ingestor:
    build: ./mqtt-ingestor
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${IOT_DB_NAME}
      DB_USER: ${IOT_DB_USER}
      DB_PASSWORD: ${IOT_DB_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_INGESTOR_USER}
      MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD}
    restart: on-failure

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
    depends_on:
      <<: *airflow-common-depends-on
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"
    environment:
      <<: *airflow-common-env
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/version')\""]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    environment:
      <<: *airflow-common-env
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure

  airflow-unpause:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        TIMEOUT=120
        for dag in etl_pipeline ingest_thingspeak data_quality cumulative_populate; do
          elapsed=0
          until airflow dags unpause "$$dag" 2>/dev/null; do
            elapsed=$$((elapsed + 5))
            if [ "$$elapsed" -ge "$$TIMEOUT" ]; then
              echo "TIMEOUT: failed to unpause $$dag after $${TIMEOUT}s"
              break
            fi
            echo "Waiting for $$dag to be parsed..."
            sleep 5
          done
          echo "Unpaused $$dag"
        done
    environment:
      <<: *airflow-common-env
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    restart: "no"

  api-server:
    build: ./api-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IOT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${IOT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${IOT_DB_PASSWORD}

volumes:
  postgres_data:
  airflow_logs:
  mosquitto_data:
